<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第一關：糖果包裝工廠－兩步驟連除</title>
<style>
  :root {
    --bg: #FFF9EC;
    --card: #FFFFFF;
    --primary: #FF7A59;
    --primary-dark: #E05A38;
    --secondary: #38B6FF;
    --accent: #FFD166;
    --success: #2EC4B6;
    --danger: #FF595E;
    --text: #2B2D42;
    --muted: #6C757D;
    --radius: 20px;
    --shadow: 0 8px 24px rgba(43, 45, 66, 0.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  /* 頂部導覽與關卡切換 */
  header {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.55rem;
    color: var(--primary-dark);
  }

  .level-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .level-tab {
    border: 2px solid #E5E7EB;
    background: #fff;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .level-tab:hover { border-color: var(--primary); }
  .level-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 10px rgba(255, 122, 89, 0.35);
  }
  .level-tab.done::after {
    content: " ✓";
    color: #FFE66D;
  }

  /* 主遊戲卡片 */
  .game-card {
    width: 100%;
    max-width: 980px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* 進度條 */
  .step-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F4F6FA;
    border-radius: 14px;
    padding: 10px 16px;
    gap: 8px;
  }

  .step-pill {
    flex: 1;
    text-align: center;
    padding: 8px 10px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--muted);
    transition: all 0.25s;
  }

  .step-pill.active {
    background: var(--secondary);
    color: #fff;
  }

  .step-pill.completed {
    background: var(--success);
    color: #fff;
  }

  /* 故事與任務題目 */
  .story-box {
    background: #FFF4D6;
    border-left: 6px solid var(--accent);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 1.08rem;
    line-height: 1.6;
  }

  .task-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    margin: 4px 0;
  }

  /* 算式填空區 */
  .equation-box {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 2rem;
    font-weight: 900;
    background: #F8FAFC;
    border: 3px dashed #CBD5E1;
    border-radius: 16px;
    padding: 16px 20px;
  }

  .op-slot {
    width: 60px;
    height: 60px;
    border: 3px solid var(--secondary);
    border-radius: 14px;
    background: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: var(--primary-dark);
    cursor: pointer;
    transition: all 0.2s;
  }

  .op-slot.focused {
    border-color: var(--primary);
    box-shadow: 0 0 0 5px rgba(255, 122, 89, 0.25);
    transform: scale(1.06);
  }

  .op-slot.correct {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .op-slot.wrong {
    background: #FFE5E5;
    border-color: var(--danger);
    color: var(--danger);
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* 運算符號按鈕 */
  .op-buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .op-btn {
    width: 78px;
    height: 78px;
    border: none;
    border-radius: 18px;
    font-size: 2.3rem;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.16);
    transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
  }

  .op-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.16);
  }

  .op-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  .op-btn.plus { background: #FF9F1C; }
  .op-btn.minus { background: #FF595E; }
  .op-btn.times { background: #8338EC; }
  .op-btn.divide { background: #3A86FF; }

  /* 動畫舞台 */
  .stage-wrapper {
    position: relative;
    background: #F0F7FF;
    border: 3px solid #D6E8FF;
    border-radius: 18px;
    min-height: 270px;
    padding: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .stage-badge {
    position: absolute;
    top: 10px;
    left: 14px;
    background: rgba(255,255,255,0.92);
    border: 2px solid #D6E8FF;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    z-index: 5;
  }

  .stage-area {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding-top: 26px;
    transition: all 0.4s ease;
  }

  /* 物件與群組樣式 */
  .item-unit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.55s ease;
  }

  .item-unit.added {
    animation: popIn 0.5s ease forwards;
    filter: drop-shadow(0 0 6px #FF9F1C);
  }

  .item-unit.removed {
    opacity: 0.15;
    transform: translateY(-28px) scale(0.5) rotate(25deg);
    filter: grayscale(1);
  }

  @keyframes popIn {
    0% { transform: scale(0) translateY(-25px); opacity: 0; }
    70% { transform: scale(1.25) translateY(0); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .multiply-banner {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    animation: zoomBurst 0.55s ease;
  }

  .multiply-clone {
    background: rgba(131, 56, 236, 0.1);
    border: 2px dashed #8338EC;
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
    font-weight: 800;
    color: #5A189A;
    font-size: 0.95rem;
  }

  @keyframes zoomBurst {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 分組包裝後的容器 */
  .group-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 2.5px solid var(--success);
    border-radius: 12px;
    padding: 6px 8px;
    gap: 4px;
    box-shadow: 0 3px 8px rgba(46, 196, 182, 0.18);
    animation: packPop 0.5s ease forwards;
  }

  .group-box.big-container {
    border-width: 3px;
    border-color: #FF7A59;
    background: #FFF8F5;
    padding: 10px 12px;
    box-shadow: 0 4px 12px rgba(255, 122, 89, 0.22);
  }

  .group-items {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    max-width: 120px;
  }

  .group-label {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--muted);
  }

  @keyframes packPop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 提示回饋區 */
  .feedback-box {
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 1.05rem;
    line-height: 1.6;
    font-weight: 600;
    display: none;
  }

  .feedback-box.show { display: block; animation: fadeIn 0.3s ease; }
  .feedback-box.hint {
    background: #FFF0F0;
    border: 2px solid #FFB3B3;
    color: #9B1C1C;
  }
  .feedback-box.success {
    background: #E6F9F6;
    border: 2px solid var(--success);
    color: #0F5132;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 連除總結流程圖 */
  .flow-summary {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 10px 0;
  }

  .flow-node {
    background: #fff;
    border: 3px solid var(--secondary);
    border-radius: 14px;
    padding: 12px 18px;
    text-align: center;
    font-weight: 800;
    font-size: 1.15rem;
    min-width: 120px;
  }

  .flow-arrow {
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--primary-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flow-arrow span {
    font-size: 0.9rem;
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 2px;
  }

  /* 底部操作按鈕 */
  .action-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 4px;
  }

  .next-btn {
    background: var(--success);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 28px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 0 #1E968B;
    transition: transform 0.12s;
    display: none;
  }

  .next-btn.show { display: inline-block; }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1E968B; }

  .reset-btn {
    background: #E2E8F0;
    color: var(--text);
    border: none;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  @media (max-width: 640px) {
    .equation-box { font-size: 1.5rem; }
    .op-slot { width: 48px; height: 48px; font-size: 1.5rem; }
    .op-btn { width: 64px; height: 64px; font-size: 1.9rem; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span style="font-size:2rem;">🏭</span>
    <h1>兩步驟連除互動工廠</h1>
  </div>
  <div class="level-tabs" id="levelTabs"></div>
</header>

<main class="game-card">
  <!-- 步驟進度條 -->
  <div class="step-bar">
    <div class="step-pill active" id="pill0">任務一：第一次分組</div>
    <div class="step-pill" id="pill1">任務二：第二次分裝</div>
    <div class="step-pill" id="pill2">任務三：連除大挑戰</div>
  </div>

  <!-- 情境故事 -->
  <div class="story-box" id="storyBox"></div>

  <!-- 任務題目 -->
  <div class="task-title" id="taskTitle"></div>

  <!-- 算式填空 -->
  <div class="equation-box" id="equationBox"></div>

  <!-- 四則運算按鈕 -->
  <div class="op-buttons" id="opButtons">
    <button class="op-btn plus" data-op="+" title="加法">＋</button>
    <button class="op-btn minus" data-op="-" title="減法">－</button>
    <button class="op-btn times" data-op="*" title="乘法">×</button>
    <button class="op-btn divide" data-op="/" title="除法">÷</button>
  </div>

  <!-- 動畫模擬舞台 -->
  <div class="stage-wrapper">
    <div class="stage-badge" id="stageBadge">目前數量</div>
    <div class="stage-area" id="stageArea"></div>
  </div>

  <!-- 引導提示與解釋 -->
  <div class="feedback-box" id="feedbackBox"></div>

  <!-- 下一步按鈕 -->
  <div class="action-row">
    <button class="next-btn" id="nextBtn">進入下一個任務 ➜</button>
    <button class="reset-btn" id="resetBtn">重新觀看本步驟</button>
  </div>
</main>

<script>
// ==========================================

};

// ==========================================
// 2. 四道關卡資料設定
// ==========================================

  {

    task1Text: "每 3 本小冊子裝成一包，可以裝成幾包？",
    task2Text: "把剛剛的 60 包小冊子，每 5 包裝成一箱，可以裝成幾箱？",
    explain: "180 本小冊子先每 3 本包成一包（180 ÷ 3 = 60 包），再把 60 包每 5 包裝進一個箱子（60 ÷ 5 = 12 箱）。連續兩次平分，就是標準的兩步驟連除！"
  }
];

// ==========================================
// 3. 遊戲狀態管理
// ==========================================
let currentLevelIdx = 0;
let currentStep = 0; // 0: 步驟一, 1: 步驟二, 2: 任務三連除大挑戰
let completedLevels = new Set();
let challengeSlots = [null, null];
let activeSlotIdx = 0;
let isAnimating = false;

const el = {
  levelTabs: document.getElementById("levelTabs"),
  pills: [document.getElementById("pill0"), document.getElementById("pill1"), document.getElementById("pill2")],
  storyBox: document.getElementById("storyBox"),
  taskTitle: document.getElementById("taskTitle"),
  equationBox: document.getElementById("equationBox"),
  opButtons: document.getElementById("opButtons"),
  stageBadge: document.getElementById("stageBadge"),
  stageArea: document.getElementById("stageArea"),
  feedbackBox: document.getElementById("feedbackBox"),
  nextBtn: document.getElementById("nextBtn"),
  resetBtn: document.getElementById("resetBtn")
};

function getLevel() { return LEVELS[currentLevelIdx]; }

function renderTabs() {
  el.levelTabs.innerHTML = "";
  LEVELS.forEach((lv, idx) => {
    const btn = document.createElement("button");
    btn.className = "level-tab" + (idx === currentLevelIdx ? " active" : "") + (completedLevels.has(idx) ? " done" : "");
    btn.textContent = lv.tabName;
    btn.onclick = () => {
      currentLevelIdx = idx;
      currentStep = 0;
      initStep();
    };
    el.levelTabs.appendChild(btn);
  });
}

function updatePills() {
  el.pills.forEach((p, idx) => {
    p.className = "step-pill";
    if (idx < currentStep) p.classList.add("completed");
    else if (idx === currentStep) p.classList.add("active");
  });
}

function setButtonsEnabled(enabled) {
  el.opButtons.querySelectorAll("button").forEach(b => b.disabled = !enabled);
}

function showFeedback(type, html) {
  el.feedbackBox.className = `feedback-box show ${type}`;
  el.feedbackBox.innerHTML = html;
}

function hideFeedback() {
  el.feedbackBox.className = "feedback-box";
  el.feedbackBox.innerHTML = "";
}

// ==========================================
// 4. 初始化各步驟畫面
// ==========================================
function initStep() {
  isAnimating = false;
  renderTabs();
  updatePills();
  hideFeedback();
  el.nextBtn.classList.remove("show");
  setButtonsEnabled(true);

  const lv = getLevel();
  const mid = lv.total / lv.d1;
  const fin = mid / lv.d2;

  el.storyBox.innerHTML = lv.story;

  if (currentStep === 0) {
    el.taskTitle.textContent = `任務一：${lv.task1Text}`;
    el.equationBox.innerHTML = `
      <span>${lv.total}</span>
      <span class="op-slot focused" id="slot0">?</span>
      <span>${lv.d1}</span>
      <span>=</span>
      <span id="eqResult">?</span>
    `;
    renderInitialItems(lv.total, lv.icon0, lv.unit0);
  } else if (currentStep === 1) {
    el.taskTitle.textContent = `任務二：${lv.task2Text}`;
    el.equationBox.innerHTML = `
      <span>${mid}</span>
      <span class="op-slot focused" id="slot0">?</span>
      <span>${lv.d2}</span>
      <span>=</span>
      <span id="eqResult">?</span>
    `;
    renderInitialItems(mid, lv.icon1, lv.unit1);
  } else {
    challengeSlots = [null, null];
    activeSlotIdx = 0;
    el.taskTitle.textContent = "任務三：連除大挑戰！請依序選出兩個正確的運算符號";
    el.equationBox.innerHTML = `
      <span>${lv.total}</span>
      <span class="op-slot focused" id="slot0" onclick="selectChallengeSlot(0)">?</span>
      <span>${lv.d1}</span>
      <span class="op-slot" id="slot1" onclick="selectChallengeSlot(1)">?</span>
      <span>${lv.d2}</span>
      <span>=</span>
      <span>${fin}</span>
    `;
    el.stageBadge.textContent = "連除算式組合區";
    el.stageArea.innerHTML = `
      <div class="flow-summary">
        <div class="flow-node">${SVG_ASSETS[lv.icon0](30)}<br>${lv.total} ${lv.unit0}</div>
        <div class="flow-arrow"><span id="arrowOp0">? ${lv.d1}</span>➜</div>
        <div class="flow-node">${SVG_ASSETS[lv.icon1](30)}<br>${mid} ${lv.unit1}</div>
        <div class="flow-arrow"><span id="arrowOp1">? ${lv.d2}</span>➜</div>
        <div class="flow-node" style="border-color:#FF7A59;">📦<br>${fin} ${lv.unit2}</div>
      </div>
    `;
  }
}

window.selectChallengeSlot = function(idx) {
  if (isAnimating) return;
  activeSlotIdx = idx;
  document.getElementById("slot0").classList.toggle("focused", idx === 0);
  document.getElementById("slot1").classList.toggle("focused", idx === 1);
};

// 繪製初始物件（最多完整繪製 180 個，縮小尺寸保持畫面整齊）
function renderInitialItems(count, iconKey, unitName) {
  el.stageBadge.textContent = `目前數量：${count} ${unitName}`;
  const size = count > 120 ? 15 : (count > 50 ? 18 : 30);
  let html = "";
  for (let i = 0; i < count; i++) {
    html += `<span class="item-unit" id="item-${i}">${SVG_ASSETS[iconKey](size)}</span>`;
  }
  el.stageArea.innerHTML = html;
}

// ==========================================
// 5. 運算符號選擇與動畫模擬核心
// ==========================================
const OP_SYMBOL = { "+": "＋", "-": "－", "*": "×", "/": "÷" };

el.opButtons.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-op]");
  if (!btn || isAnimating) return;
  const op = btn.dataset.op;

  if (currentStep === 0 || currentStep === 1) {
    handleSingleStep(op);
  } else {
    handleChallengeStep(op);
  }
});

function handleSingleStep(op) {
  const lv = getLevel();
  const isStep1 = currentStep === 0;
  const baseCount = isStep1 ? lv.total : (lv.total / lv.d1);
  const divisor = isStep1 ? lv.d1 : lv.d2;
  const iconKey = isStep1 ? lv.icon0 : lv.icon1;
  const nextIconKey = isStep1 ? lv.icon1 : null;
  const unitName = isStep1 ? lv.unit0 : lv.unit1;
  const targetUnit = isStep1 ? lv.unit1 : lv.unit2;

  const slot = document.getElementById("slot0");
  const eqRes = document.getElementById("eqResult");
  slot.textContent = OP_SYMBOL[op];
  slot.classList.remove("wrong", "correct");

  // 根據不同運算符號播放對應的數量變化動畫
  if (op === "+") {
    slot.classList.add("wrong");
    animateAdd(baseCount, divisor, iconKey, unitName);
    showFeedback("hint", `咦？選擇 <strong>加法（＋）</strong> 會把 ${divisor} 個新的${unitName}放進來，數量變成 <strong>${baseCount + divisor}</strong>，反而變多了！題目是要「分組包裝」，想想看哪個符號代表平均分組？`);
  } else if (op === "-") {
    slot.classList.add("wrong");
    animateSubtract(baseCount, divisor, iconKey, unitName);
    showFeedback("hint", `選擇 <strong>減法（－）</strong> 只會拿走 ${divisor} 個，剩下 <strong>${baseCount - divisor}</strong> 個，並沒有把全部的${unitName}都分裝完喔！再想想看哪個符號可以把全部平均分成很多組？`);
  } else if (op === "*") {
    slot.classList.add("wrong");
    animateMultiply(baseCount, divisor, iconKey, unitName);
    showFeedback("hint", `哇！選擇 <strong>乘法（×）</strong> 會讓數量變成原來的 ${divisor} 倍，暴增成 <strong>${baseCount * divisor}</strong> 個！我們是要把東西裝成一${targetUnit}一${targetUnit}，數量應該會變少才對，再試一次！`);
  } else if (op === "/") {
    isAnimating = true;
    setButtonsEnabled(false);
    slot.classList.add("correct");
    const groups = baseCount / divisor;
    eqRes.textContent = groups;
    animateDivide(baseCount, divisor, iconKey, nextIconKey, unitName, targetUnit, isStep1);
    showFeedback("success", `太棒了！選擇 <strong>除法（÷）</strong>，把 ${baseCount} ${unitName}每 ${divisor} 個平分成一${targetUnit}，剛好可以裝成 <strong>${groups} ${targetUnit}</strong>！`);
    el.nextBtn.textContent = isStep1 ? "進入任務二：第二次分裝 ➜" : "進入任務三：連除大挑戰 ➜";
    el.nextBtn.classList.add("show");
  }
}

// 動畫 1：加法（新物件飛入合併，數量變多）
function animateAdd(baseCount, addCount, iconKey, unitName) {
  renderInitialItems(baseCount, iconKey, unitName);
  const size = baseCount > 120 ? 15 : (baseCount > 50 ? 18 : 30);
  el.stageBadge.textContent = `加法模擬：${baseCount} ＋ ${addCount} ＝ ${baseCount + addCount} ${unitName}（數量增加了！）`;
  for (let i = 0; i < addCount; i++) {
    const span = document.createElement("span");
    span.className = "item-unit added";
    span.innerHTML = SVG_ASSETS[iconKey](size);
    el.stageArea.appendChild(span);
  }
}

// 動畫 2：減法（最後幾個物件被拿走淡出）
function animateSubtract(baseCount, subCount, iconKey, unitName) {
  renderInitialItems(baseCount, iconKey, unitName);
  el.stageBadge.textContent = `減法模擬：${baseCount} － ${subCount} ＝ ${baseCount - subCount} ${unitName}（只拿走了一小部分）`;
  setTimeout(() => {
    for (let i = baseCount - subCount; i < baseCount; i++) {
      const node = document.getElementById(`item-${i}`);
      if (node) node.classList.add("removed");
    }
  }, 80);
}

// 動畫 3：乘法（複製成好幾倍的群組，數量暴增）
function animateMultiply(baseCount, multCount, iconKey, unitName) {
  el.stageBadge.textContent = `乘法模擬：${baseCount} × ${multCount} ＝ ${baseCount * multCount} ${unitName}（數量倍增了！）`;
  let clones = "";
  for (let i = 1; i <= multCount; i++) {
    clones += `
      <div class="multiply-clone">
        <div>第 ${i} 份</div>
        <div>${SVG_ASSETS[iconKey](26)} × ${baseCount}</div>
      </div>
    `;
  }
  el.stageArea.innerHTML = `<div class="multiply-banner">${clones}</div>`;
}

// 動畫 4：除法（平均分組裝進容器）
function animateDivide(baseCount, divisor, iconKey, nextIconKey, unitName, targetUnit, isStep1) {
  const groups = baseCount / divisor;
  el.stageBadge.textContent = `除法模擬：每 ${divisor} 個裝成 1 ${targetUnit} ➔ 共 ${groups} ${targetUnit}！`;

  // 若分組數量較多（例如 60 包），用精簡清晰的包裝卡片呈現
  const iconSize = groups > 30 ? 12 : (isStep1 ? 15 : 24);
  let html = "";
  for (let g = 1; g <= groups; g++) {
    let inner = "";
    for (let k = 0; k < divisor; k++) {
      inner += SVG_ASSETS[iconKey](iconSize);
    }
    html += `
      <div class="group-box ${isStep1 ? "" : "big-container"}" style="animation-delay:${Math.min(g * 22, 600)}ms">
        <div class="group-items">${inner}</div>
        <div class="group-label">第 ${g} ${targetUnit}</div>
      </div>
    `;
  }
  el.stageArea.innerHTML = html;
}

// ==========================================
// 6. 任務三：連除大挑戰邏輯
// ==========================================
function handleChallengeStep(op) {
  const lv = getLevel();
  const mid = lv.total / lv.d1;
  const fin = mid / lv.d2;

  challengeSlots[activeSlotIdx] = op;
  const slotEl = document.getElementById(`slot${activeSlotIdx}`);
  const arrowEl = document.getElementById(`arrowOp${activeSlotIdx}`);
  slotEl.textContent = OP_SYMBOL[op];
  slotEl.classList.remove("wrong", "correct");
  arrowEl.textContent = `${OP_SYMBOL[op]} ${activeSlotIdx === 0 ? lv.d1 : lv.d2}`;

  // 如果只填了第一個，自動跳到第二個空格
  if (activeSlotIdx === 0 && challengeSlots[1] === null) {
    selectChallengeSlot(1);
    return;
  }

  // 兩個都填完時進行檢查
  if (challengeSlots[0] !== null && challengeSlots[1] !== null) {
    const s0 = document.getElementById("slot0");
    const s1 = document.getElementById("slot1");

    if (challengeSlots[0] === "/" && challengeSlots[1] === "/") {
      isAnimating = true;
      setButtonsEnabled(false);
      s0.classList.add("correct");
      s1.classList.add("correct");
      completedLevels.add(currentLevelIdx);
      renderTabs();

      el.stageBadge.textContent = `完整包裝流程：${lv.total} ${lv.unit0} ➔ ${mid} ${lv.unit1} ➔ ${fin} ${lv.unit2}`;
      showFeedback("success", `
        🎉 <strong>恭喜過關！你成功完成連除算式：${lv.total} ÷ ${lv.d1} ÷ ${lv.d2} = ${fin}</strong><br>
        💡 <strong>為什麼要連續使用兩次除法？</strong><br>
        ${lv.explain}
      `);

      if (currentLevelIdx < LEVELS.length - 1) {
        el.nextBtn.textContent = `挑戰下一關：${LEVELS[currentLevelIdx + 1].tabName} ➜`;
      } else {
        el.nextBtn.textContent = "全部通關！回到第一關重玩 ↺";
      }
      el.nextBtn.classList.add("show");
    } else {
      // 標記錯誤的空格並給予引導提示
      if (challengeSlots[0] !== "/") s0.classList.add("wrong");
      else s0.classList.add("correct");

      if (challengeSlots[1] !== "/") s1.classList.add("wrong");
      else s1.classList.add("correct");

      showFeedback("hint", `再檢查一下喔！回想剛剛的兩個步驟：第一步把 ${lv.total} ${lv.unit0}平分成 ${mid} ${lv.unit1}，第二步再把 ${mid} ${lv.unit1}平分成 ${fin} ${lv.unit2}。點擊紅色框框可以重新選擇符號！`);
      // 自動聚焦到第一個錯誤的框框
      selectChallengeSlot(challengeSlots[0] !== "/" ? 0 : 1);
    }
  }
}

// ==========================================
// 7. 下一步與重設按鈕事件
// ==========================================
el.nextBtn.addEventListener("click", () => {
  if (currentStep < 2) {
    currentStep++;
    initStep();
  } else {
    currentLevelIdx = (currentLevelIdx + 1) % LEVELS.length;
    currentStep = 0;
    initStep();
  }
});

el.resetBtn.addEventListener("click", () => {
  initStep();
});

// 啟動第一關
initStep();
</script>
</body>
</html>
